interface:
  display_name: "使用 Arckit"
  short_description: "用同一智能体按可信场景定义推进有界缺口"
  default_prompt: "先只读恢复状态并使用 $using-arckit 形成 PROJECT/CASE/GAP 目标提案，向用户展示目标、范围、验收、已知缺口、依赖、风险和自主执行边界；没有明确执行授权时等待确认。确认后由当前 Agent 持续推进目标级循环，每轮只处理一个有界缺口。写入状态或证据前遵循账本工作区准备约定，复用宿主本轮回执并保留已有跟踪问题。逐项理解当前不变量与可信场景规则，先核对重要决定的依据和依赖，再比较合格缺口；区分探索与正式建立，遵守事实顺序。新证据出现时重审受影响的具体主张，同一验收内继续调查与排障，重要前提或边界变化时提交、重新读取最新状态后重选。每次提交后展示收尾并读取最新快照，按门禁继续下一轮，不把 GAP 轮次结束当作目标完成。完成前核对原有义务与实际证据，说明变化及剩余工作；需要人工决定、外部条件、用户停止或资源边界时暂停；结果验证前确定预期、事项、输出目录与保留方式，读取核验后引用；根因诊断仍由调试技能独立管理。"
policy:
  allow_implicit_invocation: true
