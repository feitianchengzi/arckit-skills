interface:
  display_name: "使用 Arckit"
  short_description: "用同一智能体按可信场景定义推进有界缺口"
  default_prompt: "写入状态或证据前遵循账本工作区准备约定，复用宿主本轮回执并保留已有跟踪问题。使用 $using-arckit 围绕事项目标发现问题，逐项理解当前不变量与可信场景规则。先核对重要决定的依据和依赖，再比较合格缺口；区分探索与正式建立，遵守事实顺序。新证据出现时重审受影响的具体主张，同一验收内继续调查与排障，重要前提或边界变化时提交、重新读取最新状态后重选。完成前核对原有义务与实际证据，说明变化及剩余工作，遵守用户停止；结果验证前确定预期、事项、输出目录与保留方式，读取核验后引用；根因诊断仍由调试技能独立管理。"
policy:
  allow_implicit_invocation: true
