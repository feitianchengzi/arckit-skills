interface:
  display_name: "Arckit 开发账本"
  short_description: "确定性维护账本状态、协议恢复与状态转换"
  default_prompt: "使用 $arckit-development-ledger 通过可信快照、选择令牌、v8 状态转换和收尾确定性维护项目、迭代与事项。写入本地状态或证据前通过工作区准备维护忽略规则，保留索引并报告已有跟踪。提供可信场景定义，校验 `selection_assessment` 的前置、结论性质和显式冲突；读取当前不变量定义后声明责任、证据和未决关系，账本不替代语义判断。新增事项专属证据遵守 `cases/evidence` 归档约定，优先引用已有载体。协议不兼容时验收保留历史与未完成义务的协调转换。"
policy:
  allow_implicit_invocation: true
