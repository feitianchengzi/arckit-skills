interface:
  display_name: "Arckit 产品规格"
  short_description: "维护稳定产品行为、规则和验收口径"
  default_prompt: "使用 $arckit-spec 维护稳定产品预期事实。智能体判断动态 `case_gap` 需要产品事实时，先读取共享案例缺口契约，并基于完整上下文查询、更新、确认既有事实或判定不适用；输出 `document_scope` 与有证据支持的 `fact_result`。不写状态、不规定顺序、不决定 `Case` 完成。"
policy:
  allow_implicit_invocation: true
workflow:
  first_steps:
    - "读取 arckit/spec/INDEX.md 并判断查询或变更。"
    - "变更时先做域归属判定和体积分析。"
    - "只把稳定产品行为、规则和验收口径写入事实源。"
  boundaries:
    - "本能力由智能体按当前缺口动态调用，只能在产品事实与 arckit/spec/ 写入边界内执行。"
    - "不把候选方案、执行计划、工程实现或未确认判断写入产品规格。"
    - "不依赖已移除技能；开放问题和待处理交接保留在活跃 `Case` 中。"
  output:
    - "document_scope"
    - "fact_result"
